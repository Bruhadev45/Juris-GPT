# Fly.io config for the JurisGPT FastAPI backend.
#
# First deploy:
#   brew install flyctl && fly auth login
#   fly launch --copy-config --no-deploy   # accepts this file, creates the app
#   fly secrets set ANTHROPIC_API_KEY=... SUPABASE_URL=... SUPABASE_KEY=... \
#     CLERK_SECRET_KEY=... $(other secrets from backend/.env)
#   fly deploy
#
# Notes:
# - 2GB RAM: the 47.7k-document corpus + BM25 index live in memory (~1.2GB).
# - min_machines_running=1 and auto_stop off: corpus load takes 1-2 minutes,
#   so scale-to-zero would give brutal cold starts.
# - grace_period 180s lets the first /health pass after the index builds.

app = "jurisgpt-backend"
primary_region = "bom" # Mumbai — closest to Indian users

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Benchmark-winning retrieval configuration (see data/eval/results)
  RAG_HYBRID_SEARCH = "true"
  RAG_USE_RERANKER = "false"
  JURISGPT_VECTOR_STORE = "local"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "180s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
